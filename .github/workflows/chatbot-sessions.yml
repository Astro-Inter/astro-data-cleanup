name: Expurgo de sessões antigas do chatbot

on:
  schedule:
    - cron: "30 3 * * 0"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Executar sem excluir sessões ou pontos
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

permissions:
  contents: read

concurrency:
  group: cleanup-chatbot-sessions
  cancel-in-progress: false

jobs:
  cleanup:
    name: Executar chatbot-sessions
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      APP_ENV: production
      LOG_LEVEL: INFO
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
      MONGODB_URI: ${{ secrets.MONGODB_URI }}
      MONGODB_DATABASE: ${{ secrets.MONGODB_DATABASE }}
      QDRANT_URL: ${{ secrets.QDRANT_URL }}
      QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}

    steps:
      - name: Obter código-fonte
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Instalar dependências
        run: python -m pip install .

      - name: Executar worker
        run: python -m src.main chatbot-sessions
