name: Expurgo de usuários órfãos

on:
  schedule:
    - cron: "10 3 * * 0"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Executar sem excluir contas
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

permissions:
  contents: read

concurrency:
  group: cleanup-firebase-orphan-users
  cancel-in-progress: false

jobs:
  cleanup:
    name: Executar firebase-orphan-users
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      APP_ENV: production
      LOG_LEVEL: INFO
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
      POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
      FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
      FIREBASE_CREDENTIALS_BASE64: ${{ secrets.FIREBASE_CREDENTIALS_BASE64 }}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${{ secrets.GRAFANA_OTLP_ENDPOINT }}
      OTEL_EXPORTER_OTLP_HEADERS: ${{ secrets.GRAFANA_OTLP_HEADERS }}

    steps:
      - name: Obter código-fonte
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Instalar dependências
        run: python -m pip install .

      - name: Executar worker
        run: python -m src.main firebase-orphan-users
